services:
  - type: web
    name: govcatalyst
    runtime: node
    plan: free
    buildCommand: npm run postinstall
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPERADMIN_EMAIL
        value: learnova.service@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: DATABASE_URL
        fromDatabase:
          name: govcatalyst-db
          property: connectionString

databases:
  - name: govcatalyst-db
    plan: free
    databaseName: GovBridge
    user: postgres
